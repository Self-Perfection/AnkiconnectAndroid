# Test project for AnkiconnectAndroid. Lets `uv run pytest` resolve deps and
# run the whole suite without pip. See README.md for usage, CLAUDE.md for the
# testing approach.
[project]
name = "ankiconnectandroid-tests"
version = "0"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8",
    "requests>=2.31",
]

[tool.uv]
# These are tests, not an installable package; don't try to build them.
package = false

[tool.pytest.ini_options]
testpaths = ["."]
# Layers, run with `-m`, from most fundamental to edge cases.
markers = [
    "smoke: fundamental sanity checks (server reachable, permission granted)",
    "core: main happy-path behaviour of an action",
    "edge: edge cases, error handling, regressions",
]
