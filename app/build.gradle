plugins {
    id 'com.android.application'
}

// Release signing is wired from environment variables so that CI (GitHub Actions)
// can sign the APK using repository secrets, while local builds without these
// variables still work (they simply produce an unsigned release APK).
def keystorePath = System.getenv("ANKICONNECT_KEYSTORE_PATH")
def hasReleaseSigning = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

// Build identity (see CLAUDE.md "Build identity"): every build carries the git
// commit it was produced from, so an installed APK can be matched to its source.
// gitSha goes into versionName + BuildConfig.GIT_SHA; the CI run number drives a
// monotonically increasing versionCode so `adb install -r` always reinstalls.
// providers.exec is the configuration-cache-safe way to read git: starting a raw
// external process at configuration time (ProcessBuilder / "...".execute()) is
// rejected when the Gradle configuration cache is enabled.
def gitSha = "unknown"
try {
    gitSha = providers.exec {
        commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
    }.standardOutput.asText.get().trim()
} catch (Exception ignored) {
    // no git / not a repository: keep "unknown"
}
if (gitSha.isEmpty()) { gitSha = "unknown" }
def runNumber = System.getenv("GITHUB_RUN_NUMBER")
def baseVersionName = "1.15"
def computedVersionCode = runNumber ? 1000 + runNumber.toInteger() : 15
def computedVersionName = baseVersionName + (runNumber ? ".${runNumber}" : "") + "+g${gitSha}"

android {
    compileSdk 33

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.kamwithk.ankiconnectandroid"
        minSdk 26
        targetSdk 33
        versionCode computedVersionCode
        versionName computedVersionName
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANKICONNECT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANKICONNECT_KEY_ALIAS")
                keyPassword System.getenv("ANKICONNECT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }
    namespace 'com.kamwithk.ankiconnectandroid'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-nanolets:2.3.1'
    implementation 'com.github.ankidroid:Anki-Android:2.17alpha14'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'androidx.preference:preference:1.2.0'

    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
